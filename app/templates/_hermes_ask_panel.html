{# Hermes に聞くパネル（右から開く offcanvas）。
   使い方: {% set hermes_ask_target = ('planting', location_crop.id) %}{% include '_hermes_ask_panel.html' %}
   ログイン中で HERMES_API_KEY が設定されているときだけ出す。キーはここにも JS にも出さない。
   詳細は docs/frontend/hermes-ask-panel.md #}
{% if hermes_ask_enabled() %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/hermes-ask.css') }}">

<button type="button" class="btn btn-success hermes-ask-fab" data-bs-toggle="offcanvas"
        data-bs-target="#hermes-ask-panel" aria-controls="hermes-ask-panel">
    <img src="{{ url_for('static', filename='images/icon_hermes.webp') }}" alt="" class="icon-img"> Hermes に聞く
</button>

<div class="offcanvas offcanvas-end hermes-ask-panel" tabindex="-1" id="hermes-ask-panel"
     data-bs-scroll="true" data-bs-backdrop="false" aria-labelledby="hermes-ask-title"
     data-entity-type="{{ hermes_ask_target[0] }}" data-entity-id="{{ hermes_ask_target[1] }}"
     data-hermes-ask
     data-history-url="/hermes/ask/{{ hermes_ask_target[0] }}/{{ hermes_ask_target[1] }}/history"
     data-runs-url="/hermes/ask/{{ hermes_ask_target[0] }}/{{ hermes_ask_target[1] }}/runs"
     data-new-url="/hermes/ask/{{ hermes_ask_target[0] }}/{{ hermes_ask_target[1] }}/new">
    <div class="offcanvas-header py-2">
        <h5 class="offcanvas-title" id="hermes-ask-title">
            <img src="{{ url_for('static', filename='images/icon_hermes.webp') }}" alt="" class="icon-img"> Hermes に聞く
        </h5>
        <div class="ms-auto me-2">
            <button type="button" class="btn btn-link btn-sm p-0" data-hermes-new>新しく始める</button>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="閉じる"></button>
    </div>
    <div class="px-3 pb-1">
        <span class="hermes-ask-context" data-hermes-context></span>
    </div>
    <div class="offcanvas-body hermes-ask-messages" data-hermes-messages></div>
    <div class="hermes-ask-foot">
        <div class="text-danger small mb-1 d-none" data-hermes-error></div>
        <div class="input-group input-group-sm">
            <textarea class="form-control" rows="2" maxlength="4000" placeholder="質問を入力（Ctrl+Enter で送る）" data-hermes-input></textarea>
            <button type="button" class="btn btn-success" data-hermes-send>送る</button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/hermes-ask.js') }}"></script>
{% endif %}
