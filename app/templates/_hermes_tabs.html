<ul class="nav nav-tabs mb-3">
    <li class="nav-item">
        <a class="nav-link {% if hermes_tab == 'conversations' %}active{% endif %}" href="{{ url_for('conversations.list') }}">会話</a>

        <a class="nav-link {% if hermes_tab == 'advices' %}active{% endif %}" href="{{ url_for('advices.list') }}">アドバイス</a>

</ul>
