<div class="mb-3">
    <label for="name" class="form-label">作物名 <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="name" name="name" value="{{ fv.get('name', '') }}" required>
</div>
<div class="mb-3">
    <label for="crop_type" class="form-label">作物種類 <span class="text-danger">*</span></label>
    <input type="text" class="form-control" id="crop_type" name="crop_type" value="{{ fv.get('crop_type', '') }}"
           placeholder="例: トマト、なす" required>
</div>
<div class="mb-3">
    <div class="d-flex justify-content-between align-items-start mb-2">
        <label for="notes" class="form-label mb-0">メモ</label>
        {% set ai_mode = 'crop' %}
        {% include '_ai_notes_button.html' %}
    </div>
    <textarea class="form-control" id="notes" name="notes" rows="6">{{ fv.get('notes', '') }}</textarea>
</div>
{% include 'photo_sort/_icon_picker.html' %}
<div class="mb-3">
    <label for="image_color" class="form-label">イメージカラー</label>
    <input type="color" class="form-control form-control-color" id="image_color" name="image_color"
           value="{{ fv.get('image_color') or '#4CAF50' }}">
</div>
