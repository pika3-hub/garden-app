<div class="row">
    <div class="col-md-7 mb-3">
        <label for="title" class="form-label">タイトル <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="title" name="title" value="{{ fv.get('title', '') }}"
               data-ai-field="title" required>
    </div>
    <div class="col-md-5 mb-3">
        <label for="entry_date" class="form-label">日付 <span class="text-danger">*</span></label>
        <input type="date" class="form-control" id="entry_date" name="entry_date"
               value="{{ fv.get('entry_date') or default_date }}" data-ai-date required>
    </div>
</div>
<div class="mb-3">
    <label for="weather" class="form-label">天気</label>
    <select class="form-select" id="weather" name="weather">
        <option value="">-- 選択してください --</option>
        {% for w in ['晴れ', '曇り', '雨', '雪', '晴れ時々曇り', '曇り時々雨'] %}
        <option value="{{ w }}"{% if fv.get('weather') == w %} selected{% endif %}>{{ w }}</option>
        {% endfor %}
    </select>
</div>
<div class="mb-3">
    <div class="d-flex justify-content-between align-items-start mb-2">
        <label for="content" class="form-label mb-0">内容</label>
        {% include 'photo_sort/_ai_draft_button.html' ignore missing %}
    </div>
    <textarea class="form-control" id="content" name="content" rows="5" data-ai-field="content">{{ fv.get('content', '') }}</textarea>
</div>
{% include 'photo_sort/_relations.html' %}
