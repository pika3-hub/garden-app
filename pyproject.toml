[project]
name = "garden-manager"
version = "0.1.0"
description = "家庭菜園管理Webアプリケーション"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "anthropic>=1.11.0",
    "flask==3.1.2",
    "pillow==12.1.1",
    "python-dotenv==1.2.1",
    "waitress>=3.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
