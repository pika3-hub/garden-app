<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像カタログ — garden-app</title>
  <style>
    body {
      background: #fff;
      color: #222;
      font-family: sans-serif;
      margin: 0;
      padding: 24px 32px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 16px; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .toggle-btn {
      padding: 6px 16px;
      border: 1px solid #888;
      border-radius: 4px;
      background: #f0f0f0;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .toggle-btn:hover { background: #e0e0e0; }
    .mode-label { font-size: 0.85rem; color: #666; }

    h2 {
      font-size: 1.1rem;
      margin: 40px 0 12px;
      padding: 6px 12px;
      background: #f0f0f0;
      border-left: 4px solid #888;
    }

    /* --- フィットモード（デフォルト） --- */
    body:not(.raw) .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
    }
    body:not(.raw) .grid.large {
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    }
    body:not(.raw) figure {
      margin: 0;
      padding: 8px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: #fafafa;
    }
    body:not(.raw) .img-box {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body:not(.raw) .img-box.sm { height: 80px; }
    body:not(.raw) .img-box.lg { height: 160px; }
    body:not(.raw) .img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    body:not(.raw) figcaption {
      font-size: 0.7rem;
      color: #555;
      word-break: break-all;
      text-align: center;
    }

    /* --- 原寸モード --- */
    body.raw .grid { display: flex; flex-wrap: wrap; gap: 16px; }
    body.raw figure { margin: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
    body.raw .img-box { display: contents; }
    body.raw figcaption { font-size: 0.7rem; color: #555; }
  </style>
</head>
<body>

<h1>画像カタログ — app/static/images/</h1>
<div class="toolbar">
  <button class="toggle-btn" onclick="toggleMode(this)">原寸表示に切り替え</button>
  <span class="mode-label" id="mode-label">現在: フィット表示</span>
</div>
<script>
  function toggleMode(btn) {
    const raw = document.body.classList.toggle('raw');
    btn.textContent = raw ? 'フィット表示に切り替え' : '原寸表示に切り替え';
    document.getElementById('mode-label').textContent = raw ? '現在: 原寸表示' : '現在: フィット表示';
  }
</script>
